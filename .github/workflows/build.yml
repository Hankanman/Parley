name: "Build"

# Builds the Parley (parley-gpui) AppImage via ./build.sh cpu. GitHub-hosted
# runners have no GPU, so every CI build is CPU-only; use ./build.sh
# cuda|vulkan locally for accelerated builds.

on:
  workflow_call:
    inputs:
      platform:
        required: false
        type: string
        default: "ubuntu-22.04"
      release-id:
        required: false
        type: string
      upload-artifacts:
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Get version from parley-gpui/Cargo.toml
        id: get-version
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version/ {print $2; exit}' parley-gpui/Cargo.toml)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ inputs.platform }}-gpui-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf libasound2-dev libx11-dev libxtst-dev libxrandr-dev \
            libpipewire-0.3-dev libclang-dev meson ninja-build \
            fuse libfuse2

      - name: Build AppImage (CPU)
        run: ./build.sh cpu

      - name: Verify AppImage before post-processing
        run: |
          f="Parley-${{ steps.get-version.outputs.version }}-x86_64.AppImage"
          [ -f "$f" ] || { echo "::error::no AppImage produced ($f)"; exit 1; }
          size=$(stat -c%s "$f"); echo "$f: $size bytes"
          if [ "$size" -lt 50000000 ]; then echo "::error::AppImage is only $size bytes"; exit 1; fi
          chmod +x "$f"
          ./"$f" --appimage-extract >/dev/null 2>&1 || { echo "::error::AppImage does not extract"; exit 1; }
          if ! find squashfs-root -name 'libsherpa-onnx-c-api.so*' | grep -q .; then
            echo "::error::libsherpa-onnx-c-api.so is not bundled in the AppImage"; exit 1
          fi
          rm -rf squashfs-root

      - name: Upload to release
        if: inputs.release-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.get-version.outputs.version }}" \
            "Parley-${{ steps.get-version.outputs.version }}-x86_64.AppImage" \
            --repo "${{ github.repository }}" --clobber

      - name: Upload artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parley-${{ inputs.platform }}-${{ steps.get-version.outputs.version }}
          path: Parley-*.AppImage
          retention-days: 30
