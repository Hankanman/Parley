name: "Website"

# Publishes site/ (plus the screenshots in docs/images/) to GitHub Pages:
# https://meetparley.app (custom domain; site/CNAME), and the user guide in
# docs/user/ (mdBook) at https://meetparley.app/docs/

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "docs/user/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          v=0.5.4
          mkdir -p ~/.local/bin
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v$v/mdbook-v$v-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/images _site/images
          mdbook build docs/user --dest-dir "$PWD/_site/docs"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
