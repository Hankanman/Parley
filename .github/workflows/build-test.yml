name: "Build Test"

on: workflow_dispatch

jobs:
  build-test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - "ubuntu-24.04"
        mode:
          - "cpu"
          - "vulkan"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      mode: ${{ matrix.mode }}
      upload-artifacts: true
    secrets: inherit
