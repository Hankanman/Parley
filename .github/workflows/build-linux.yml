name: "Build and Test - Linux"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'GPU mode'
        required: true
        type: choice
        options:
          - cpu
        default: cpu
      ubuntu-version:
        description: 'Ubuntu version'
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
        default: ubuntu-22.04
      upload-artifacts:
        description: 'Upload build artifacts'
        required: true
        type: boolean
        default: true

# Cancel duplicate workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # linuxdeploy's bundled `strip` chokes on SHT_RELR sections in modern libs
  # (same workaround as build.sh); the release profile already strips symbols.
  NO_STRIP: 1

jobs:
  build-linux:
    name: Build Linux (x64)
    runs-on: ${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from parley-gpui/Cargo.toml
        id: get-version
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version/ {print $2; exit}' parley-gpui/Cargo.toml)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}-x86_64-unknown-linux-gnu-gpui

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf libasound2-dev libx11-dev libxtst-dev libxrandr-dev \
            libpipewire-0.3-dev libclang-dev meson ninja-build

      - name: Install FUSE for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2

      - name: Build AppImage
        run: ./build.sh "${{ github.event.inputs.mode || 'cpu' }}"

      - name: Verify AppImage
        run: |
          f="Parley-${{ steps.get-version.outputs.version }}-x86_64.AppImage"
          [ -f "$f" ] || { echo "::error::no AppImage produced ($f)"; exit 1; }
          size=$(stat -c%s "$f")
          echo "$f: $size bytes"
          if [ "$size" -lt 50000000 ]; then echo "::error::AppImage is only $size bytes"; exit 1; fi
          chmod +x "$f"
          ./"$f" --appimage-extract >/dev/null 2>&1 || { echo "::error::AppImage does not extract"; exit 1; }
          if ! find squashfs-root -name 'libsherpa-onnx-c-api.so*' | grep -q .; then
            echo "::error::libsherpa-onnx-c-api.so is not bundled in the AppImage"; exit 1
          fi
          ./"$f" --appimage-help
          rm -rf squashfs-root

      - name: Upload artifacts
        if: ${{ github.event.inputs.upload-artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: parley-linux-${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }}-x64-${{ steps.get-version.outputs.version }}
          path: Parley-*.AppImage
          retention-days: 30

      - name: Generate build summary
        run: |
          echo "## Linux Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | ${{ steps.get-version.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Mode** | ${{ github.event.inputs.mode || 'cpu' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ubuntu Version** | ${{ github.event.inputs.ubuntu-version || 'ubuntu-22.04' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -la Parley-*.AppImage >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No AppImage found" >> "$GITHUB_STEP_SUMMARY"
