[package]
name = "gigaam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic", "cuda"] }
rustfft = "6"
sentencepiece-rs = "=0.2.2"
sha2 = "0.10"
libloading = "0.8"
libc = "0.2"
