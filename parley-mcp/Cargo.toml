[package]
name = "parley-mcp"
version = "0.1.0"
edition = "2021"
description = "Standalone MCP (Model Context Protocol) stdio server over the Parley meeting database"
license = "MIT"

[[bin]]
name = "parley-mcp"
path = "src/main.rs"

[dependencies]
# Official Rust MCP SDK. `transport-io` is the server-side stdio transport
# (the MCP client spawns this binary and speaks JSON-RPC over stdin/stdout).
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
chrono = "0.4.31"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Release profile lives at the workspace root (Cargo only honors profiles
# from the root manifest). See top-level Cargo.toml.
