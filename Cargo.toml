[workspace]
resolver = "2"
members = [
    "llama-helper",
    "llama-protocol",
    "parley-core",
    "parley-mcp",
    "whisper-helper",
    "whisper-protocol",
    "whisper-core",
    "parley-gpui"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.85"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Local patches must live at the workspace root — cargo ignores
# [patch.crates-io] sections in non-root package manifests.

# Profiles must live at the workspace root (cargo ignores them in member
# manifests). parley uses cargo's default release profile (opt-level=3)
# while llama-helper wants size-optimised "s" for faster sidecar startup.
#
# lto/strip are workspace-profile-only settings (cargo rejects `lto` at the
# per-package [profile.release.package.*] level — see below), so they live
# here and apply to every crate in the workspace, including llama-helper and
# parley-mcp; those two keep their own opt-level/codegen-units overrides.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# NOTE: `NO_STRIP` in build.sh works around a Fedora linuxdeploy SHT_RELR
# issue in the *bundler* step (AppImage packaging), not this cargo profile —
# `strip = true` here still runs during `cargo build --release` regardless
# of that env var; it only suppresses linuxdeploy's own separate strip pass.
[profile.release.package.llama-helper]
codegen-units = 1
opt-level = "s"

# parley-mcp is a short-lived stdio sidecar spawned per MCP session — its cost
# is startup and footprint, not throughput, so optimise it for size like
# llama-helper.
[profile.release.package.parley-mcp]
codegen-units = 1
opt-level = "s"

# whisper-helper (issue #56 spike): same rationale as llama-helper — lazily
# spawned, short-lived, startup time and AppImage footprint matter more than
# this crate's own codegen (whisper.cpp/ggml itself always builds at -O3
# regardless of this profile).
[profile.release.package.whisper-helper]
codegen-units = 1
opt-level = "s"
